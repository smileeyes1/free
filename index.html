<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher OS v13 - FULL UPGRADED UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <header class="bg-slate-900 text-white p-4 shadow-md">
        <div class="container mx-auto flex flex-wrap gap-4 justify-between items-center">
            <h1 class="text-xl font-bold">🏛️ Teacher OS v13 - Frontend Engine</h1>
            <div class="flex gap-2">
                <input id="teacher" placeholder="اسم المعلم" class="bg-slate-800 px-3 py-1 rounded text-sm text-white border border-slate-700 focus:outline-none focus:border-blue-500">
                <input id="school" placeholder="المدرسة" class="bg-slate-800 px-3 py-1 rounded text-sm text-white border border-slate-700 focus:outline-none focus:border-blue-500">
            </div>
        </div>
    </header>

    <div class="container mx-auto p-4 flex flex-col md:flex-row gap-4">
        <aside class="w-full md:w-72 bg-white border border-gray-200 rounded-xl p-4 shadow-sm space-y-4">
            <h2 class="font-bold border-b pb-2">سجل الطلاب المباشر</h2>
            <div class="flex gap-2">
                <input id="newStudent" placeholder="اسم الطالب الجديد..." class="w-full border p-2 rounded text-sm focus:outline-none focus:border-blue-500">
                <button onclick="addStudent()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded text-sm font-bold transition">
                    ➕
                </button>
            </div>
            <div id="studentsList" class="text-sm space-y-2 max-h-64 overflow-y-auto p-2 bg-gray-50 rounded border">
                <div class="text-gray-400 text-center text-xs py-4">لا يوجد طلاب مسجلون حالياً</div>
            </div>
            <hr>
            <div class="text-xs text-gray-600 bg-gray-100 p-2 rounded flex justify-between items-center">
                <span>📡 حالة ناقل البيانات المركزي:</span>
                <span id="connectionStatus" class="font-bold text-orange-600">ينتظر التفعيل...</span>
            </div>
        </aside>

        <main class="flex-1 space-y-4">
            <div class="bg-white border rounded-xl p-4 shadow-sm space-y-4">
                <h2 class="font-bold border-b pb-2">سياق الحصة الذكي (Lesson Context)</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input id="lessonTopic" placeholder="موضوع الحصة الدراسي الحالي" class="border p-2 rounded text-sm w-full focus:outline-none focus:border-blue-500">
                    <select id="lessonTarget" class="border p-2 rounded text-sm w-full focus:outline-none focus:border-blue-500">
                        <option value="الكل">استهداف: المستوى العام الموحد</option>
                        <option value="ضعيف">استهداف: الدعم العلاجي العاجل</option>
                        <option value="متفوق">استهداف: التوسعة الإثرائية المتقدمة</option>
                    </select>
                </div>
                
                <textarea id="input" rows="5" placeholder="أدخل الملاحظات التنفيذية أو المادة العلمية للحصة هنا..." class="w-full border p-3 rounded text-sm focus:outline-none focus:border-blue-500"></textarea>
                
                <button onclick="runSystem()" class="w-full bg-green-600 hover:bg-green-700 text-white px-4 py-3 rounded-lg font-bold text-lg shadow transition">
                    🚀 تشغيل النظام الشامل وإرسال البيانات إلى v18
                </button>
            </div>

            <div class="bg-slate-800 text-green-400 border border-slate-700 rounded-xl p-5 min-h-[250px] shadow-sm relative font-mono text-sm leading-relaxed">
                <div class="absolute top-2 left-3 text-xs text-slate-500">مخرجات الحصة الحالية</div>
                <div id="output" class="whitespace-pre-wrap mt-2">في انتظار معالجة البيانات...</div>
            </div>
            <div id="status" class="text-xs text-center font-bold"></div>
        </main>
    </div>

    <script>
        /* ================= STATE MANAGEMENT ================= */
        let STUDENTS = [];

        /* ================= UTILITIES ================= */
        function clean(text){ 
            return (text || "").replace(/\s+/g,' ').trim(); 
        }

        /* ================= STUDENT CORE MANAGEMENT ================= */
        function addStudent(){
            const inputElement = document.getElementById("newStudent");
            const name = clean(inputElement.value);
            if(!name) return;
            
            if(!STUDENTS.includes(name)){
                STUDENTS.push(name);
                renderStudents();
                sendToCore({ type: "student_add", data: { name: name } });
            }
            inputElement.value = "";
        }

        function renderStudents(){
            const listContainer = document.getElementById("studentsList");
            if(STUDENTS.length === 0){
                listContainer.innerHTML = `<div class="text-gray-400 text-center text-xs py-4">لا يوجد طلاب مسجلون حالياً</div>`;
                return;
            }
            listContainer.innerHTML = STUDENTS.map((student, index) => 
                `<div class="bg-white p-2 rounded shadow-sm border border-gray-100 flex justify-between items-center">
                    <span class="font-bold text-gray-700">${index + 1}. ${student}</span>
                </div>`
            ).join("");
        }

        /* ================= ANALYTICS LAYER (FULLY PRESERVED) ================= */
        function analyze(text, topic, target){
            const t = clean(text);
            return {
                text: t,
                topic: topic,
                target: target,
                weak: /ضعيف|تبسيط|علاج/.test(t) || target === "ضعيف",
                strong: /متفوق|إثراء|متقدم/.test(t) || target === "متفوق",
                review: /مراجعة|تثبيت/.test(t),
                exam: /اختبار|امتحان|تقييم/.test(t),
                worksheet: /ورقة|نشاط/.test(t),
                lesson: /درس|شرح/.test(t) || topic.length > 0,
                complex: t.length > 80
            };
        }

        /* ================= DECISION ENGINE (FULLY PRESERVED) ================= */
        function decide(analysis, studentCount){
            let type = "حصة درس";
            let goal = "تعلم أساسي";
            let mode = "عادي";

            if(analysis.exam) type = "حصة اختبار";
            else if(analysis.worksheet) type = "نشاط تطبيقي";
            else if(analysis.lesson) type = "حصة درس";

            if(analysis.weak){ 
                type = "حصة علاجية"; 
                goal = "رفع الفهم وتثبيت الأساسيات المعرفية للطلاب"; 
            } else if(analysis.strong){ 
                type = "حصة إثرائية"; 
                goal = "توسيع التفكير الاستراتيجي والمهارات العليا للمتفوقين"; 
            } else if(analysis.review){ 
                type = "حصة مراجعة"; 
                goal = "تثبيت وتكرار المعرفة المكتسبة سابقاً"; 
            }

            if(analysis.complex || studentCount > 25){
                mode = "متقدم";
                goal += " + إدارة صفية متكاملة لضبط المستويات التفاعلية";
            }

            return { type, goal, mode, topic: analysis.topic };
        }

        /* ================= LESSON STRUCTURER ================= */
        function buildLesson(decision, studentCount){
            const groupsCount = Math.max(2, Math.ceil(studentCount / 5));
            return `🎯 العنوان التعليمي: ${decision.topic || "عام وموحد"}\n📌 النمط الإجرائي: ${decision.type} | البيئة التشغيلية: ${decision.mode}\n👥 القوة الاستيعابية: ${studentCount} طالباً | تشكيل المجموعات: ${groupsCount} مجموعات نشطة\n\n🕒 البروتوكول الزمني المعتمد لإدارة الحصة (45 دقيقة):\n[05 د] 🟡 التمهيد المباشر: استدعاء التغذية القبلية وتهيئة الأذهان.\n[10 د] 📘 الشرح الإجرائي: عرض المفاهيم المباشرة وتحقيق هدف (${decision.goal}).\n[20 د] 🧠 النشاط التطبيقي: توزيع المهام والعمل المستقل داخل المجموعات الـ ${groupsCount}.\n[07 د] 📊 القياس والتقويم: رصد الأداء اللحظي وجمع البيانات الاستدلالية.\n[03 د] 🏁 الغلق والإنهاء: تلخيص المكتسبات وتثبيت المهام القادمة.`;
        }

        /* ================= NETWORK PROTOCOL BRIDGE ================= */
        function sendToCore(packet){
            try {
                const payload = JSON.stringify({ id: Date.now(), ...packet });
                localStorage.setItem("V18_BRIDGE", payload);
                
                const statusLabel = document.getElementById("connectionStatus");
                statusLabel.innerText = "متصل بنجاح ✔";
                statusLabel.className = "font-bold text-green-600";
                
                setTimeout(() => {
                    statusLabel.innerText = "جاهز للإرسال التالي ⚡";
                    statusLabel.className = "font-bold text-blue-600";
                }, 1500);
            } catch(e) {
                document.getElementById("connectionStatus").innerText = "خطأ في المزامنة";
                document.getElementById("connectionStatus").className = "font-bold text-red-600";
            }
        }

        /* ================= SYSTEM EXECUTION LOOP ================= */
        function runSystem(){
            const inputData = document.getElementById("input").value;
            const topicData = document.getElementById("lessonTopic").value;
            const targetData = document.getElementById("lessonTarget").value;

            if(!inputData && !topicData){
                document.getElementById("status").innerText = "⚠️ إدخال البيانات أو الموضوع إلزامي للتشغيل";
                document.getElementById("status").className = "text-xs text-center font-bold text-red-600";
                return;
            }

            const currentAnalysis = analyze(inputData, topicData, targetData);
            const currentDecision = decide(currentAnalysis, STUDENTS.length);
            const formattedLesson = buildLesson(currentDecision, STUDENTS.length);

            // إرسال الحزم التشغيلية بترتيب معزول ومحمي لمنع التداخل
            sendToCore({ type: "students_snapshot", data: { students: STUDENTS } });
            sendToCore({ type: "analysis", data: currentAnalysis });
            sendToCore({ type: "lesson", data: currentDecision });
            sendToCore({
                type: "lesson_impact", 
                data: {
                    topic: currentDecision.topic,
                    type: currentDecision.type,
                    students_count: STUDENTS.length,
                    timestamp: new Date().toISOString()
                }
            });

            document.getElementById("output").innerText = formattedLesson;
            document.getElementById("status").innerText = "✔ تم التنفيذ وتحديث مصفوفة البيانات المركزية بنجاح";
            document.getElementById("status").className = "text-xs text-center font-bold text-green-600";
        }
    </script>
</body>
</html>
