<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النظام التعليمي المطور - معالجة متقدمة</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background-color: #f1f5f9; color: #0f172a; padding: 20px; }
.container { max-width: 1250px; margin: 0 auto; }
.main-header { background: #1e3a8a; color: #ffffff; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
.card { background: #ffffff; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #cbd5e1; }
.card h3 { color: #1e3a8a; margin-bottom: 15px; border-right: 4px solid #2563eb; padding-right: 10px; font-size: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
.form-group { margin-bottom: 15px; }
label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; color: #334155; }
input, textarea, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc; font-size: 14px; color: #0f172a; }
input:focus, textarea:focus, select:focus { outline: none; border-color: #2563eb; background: #ffffff; }
button { padding: 10px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn-blue { background: #2563eb; color: white; }
.btn-green { background: #16a34a; color: white; }
.btn-dark { background: #475569; color: white; }
.btn-danger { background: #dc2626; color: white; }
.progress-container { display: none; margin: 15px 0; background: #e2e8f0; border-radius: 4px; overflow: hidden; height: 8px; }
.progress-bar-pulse { height: 100%; width: 100%; background: linear-gradient(90deg, #2563eb 25%, #60a5fa 50%, #2563eb 75%); background-size: 200% 100%; animation: loadingPulse 1.2s infinite linear; }
@keyframes loadingPulse { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.status-text { font-size: 12px; font-weight: bold; color: #2563eb; margin-top: 5px; display: none; text-align: center; }
.tabs-nav { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid #cbd5e1; flex-wrap: wrap; }
.tab-link { padding: 10px 15px; background: #e2e8f0; border-radius: 6px 6px 0 0; cursor: pointer; font-weight: 600; color: #475569; font-size: 13px; margin-bottom: -2px; }
.tab-link.active { background: #1e3a8a; color: #ffffff; border-bottom: 2px solid #1e3a8a; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.editor-toolbar { background: #f8fafc; border: 1px solid #cbd5e1; border-bottom: none; padding: 8px; border-radius: 6px 6px 0 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn-tool { padding: 4px 10px; font-size: 11px; background: #e2e8f0; color: #334155; border-radius: 4px; font-weight: bold; }
.output-view { background: #ffffff; padding: 30px; border: 1px solid #cbd5e1; border-radius: 0 0 6px 6px; min-height: 500px; font-size: 15px; line-height: 1.8; color: #000000; outline: none; overflow-y: auto; }
.error-msg { color: #dc2626; font-weight: bold; padding: 15px; border: 1px solid #dc2626; border-radius: 6px; background: #fee2e2; }
table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #ffffff; }
th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: center; font-size: 13px; }
th { background: #f1f5f9; color: #1e3a8a; font-weight: 700; }
td input[type="number"] { width: 70px; text-align: center; padding: 5px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; font-weight: bold; }
.print-preview-value, #print-header-sheet { display: none; }
@media print {
  .no-print, button, input, select, textarea, .tabs-nav, .progress-container, .status-text, .editor-toolbar { display: none !important; }
  body, .container { background: #ffffff !important; padding: 0 !important; margin: 0 !important; width: 100% !important; max-width: 100% !important; }
  .tab-content { display: none !important; } .tab-content.active { display: block !important; }
  .card, .output-view { border: none !important; padding: 0 !important; margin: 0 !important; }
  table { border: 1px solid #000000 !important; } th, td { border: 1px solid #000000 !important; padding: 6px !important; font-size: 11px !important; }
  td input[type="number"] { display: none !important; } .print-preview-value { display: inline !important; font-weight: bold !important; }
  #print-header-sheet { display: block !important; width: 100%; margin-bottom: 25px; border-bottom: 2px solid #000000; padding-bottom: 8px; }
}
</style>
</head>
<body>
<div class="container">
  
  <header class="main-header no-print">
    <h2>النظام التعليمي الموحد - معالجة الاستثناءات المتقدمة (OCR & Error Handling)</h2>
  </header>

  <div id="print-header-sheet">
    <table style="width: 100%; border: none !important;">
      <tr style="border: none !important;">
        <td style="text-align: right; border: none !important; width: 33%; font-size: 12px;"><b>دولة فلسطين</b><br>وزارة التربية والتعليم العالي<br><span id="lbl-d"></span></td>
        <td style="text-align: center; border: none !important; width: 33%;"><b style="font-size: 16px;" id="lbl-title">مستند إداري وتربوي معتمد</b></td>
        <td style="text-align: left; border: none !important; width: 33%; font-size: 12px;"><b>المدرسة:</b> <span id="lbl-s"></span><br><b>المعلم:</b> <span id="lbl-t"></span></td>
      </tr>
    </table>
  </div>

  <div class="card no-print">
    <h3>⚙️ إعدادات النظام وتغذية البيانات</h3>
    <div class="grid-3">
      <div class="form-group">
        <label>Google Cloud API Key:</label>
        <input id="api_key" type="password">
      </div>
      <div class="form-group" style="display: flex; align-items: flex-end; gap: 5px;">
        <button onclick="saveKey()" class="btn-green" style="width: 100%;">حفظ</button>
      </div>
    </div>

    <div class="grid-3" style="margin-top: 5px;">
      <div class="form-group"><label>المعلم:</label><input id="inp_teacher" value="محمد وجيه غنام" oninput="syncMeta()"></div>
      <div class="form-group"><label>المدرسة:</label><input id="inp_school" value="مدرسة عاطوف المختلطة" oninput="syncMeta()"></div>
      <div class="form-group"><label>المديرية:</label><input id="inp_directorate" value="طوباس" oninput="syncMeta()"></div>
    </div>

    <div class="grid-2" style="margin-top: 5px;">
      <div class="form-group">
        <label>سجل أسماء الطلاب:</label>
        <textarea id="inp_students" rows="5"></textarea>
      </div>
      <div class="form-group" style="background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px dashed #cbd5e1;">
        <label style="color: #1e3a8a;">📷 استخراج المنهاج المرجعي (يدعم PDFs المصورة):</label>
        <input type="file" id="pdf_file" accept=".pdf" style="margin-top: 8px;">
        <button onclick="readPDF()" class="btn-dark" style="width: 100%; margin-top: 10px;">استخلاص ومعالجة النصوص (OCR ذكي)</button>
        <div id="pdf_status" style="font-size: 11px; margin-top: 5px; color: #b91c1c;"></div>
      </div>
    </div>

    <div class="progress-container" id="global_progress_container"><div class="progress-bar-pulse"></div></div>
    <div class="status-text" id="global_status_text">جاري المعالجة...</div>

    <div class="grid-3" style="margin-top: 5px; border-top: 1px solid #cbd5e1; padding-top: 10px;">
      <div class="form-group">
        <label>نوع المخرج:</label>
        <select id="generation_target" onchange="toggleCustomRequest()">
          <option value="plans">📘 خطة درس (درس واحد فقط لتجنب تجاوز الحد)</option>
          <option value="worksheets">📝 ورقة عمل</option>
          <option value="exams">🧪 اختبار تحصيلي</option>
          <option value="custom">✨ محتوى مخصص</option>
        </select>
      </div>
      <div class="form-group"><label>موضوع الدرس الدقيق:</label><input id="generation_topic"></div>
      <div class="form-group" style="display: flex; align-items: flex-end;">
        <button onclick="launchSinglePipeline()" class="btn-blue" style="width: 100%; height: 40px;">🚀 توليد المتن</button>
      </div>
    </div>
    
    <div class="form-group" id="custom_request_group" style="display: none; margin-top: 15px;">
      <label>الطلب المخصص:</label>
      <textarea id="custom_request_text" rows="3"></textarea>
    </div>
  </div>

  <div class="tabs-nav no-print">
    <div class="tab-link active" onclick="openTab('sec_plans', this)">📘 تحضير</div>
    <div class="tab-link" onclick="openTab('sec_worksheets', this)">📝 أوراق عمل</div>
    <div class="tab-link" onclick="openTab('sec_exams', this)">🧪 امتحانات</div>
    <div class="tab-link" onclick="openTab('sec_custom', this)">✨ مخصص</div>
  </div>

  <div id="sec_plans" class="tab-content active"><div class="card"><div id="view_plans" class="output-view" contenteditable="true"></div></div></div>
  <div id="sec_worksheets" class="tab-content"><div class="card"><div id="view_worksheets" class="output-view" contenteditable="true"></div></div></div>
  <div id="sec_exams" class="tab-content"><div class="card"><div id="view_exams" class="output-view" contenteditable="true"></div></div></div>
  <div id="sec_custom" class="tab-content"><div class="card"><div id="view_custom" class="output-view" contenteditable="true"></div></div></div>

</div>

<script>
let contextDataText = "";

window.onload = function() {
  const savedKey = localStorage.getItem('app_secure_key');
  if(savedKey) document.getElementById('api_key').value = savedKey;
  syncMeta();
};

function toEasternNumerals(num) {
  if (num === null || num === undefined || isNaN(num)) return "٠";
  const easternDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
  return num.toString().replace(/[0-9]/g, w => easternDigits[+w]);
}

function convertTextToEasternNumerals(text) {
  if (!text) return "";
  const easternDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
  return text.replace(/[0-9]/g, w => easternDigits[+w]);
}

function saveKey() {
  const k = document.getElementById('api_key').value.trim();
  if(k) { localStorage.setItem('app_secure_key', k); alert("تم الحفظ."); }
}

function syncMeta() {
  document.getElementById('lbl-t').innerText = document.getElementById('inp_teacher').value.trim();
  document.getElementById('lbl-s').innerText = document.getElementById('inp_school').value.trim();
  document.getElementById('lbl-d').innerText = document.getElementById('inp_directorate').value.trim();
}

function showProgress(msg) {
  document.getElementById("global_progress_container").style.display = "block";
  const st = document.getElementById("global_status_text");
  st.style.display = "block"; st.innerText = msg;
}

function hideProgress() {
  document.getElementById("global_progress_container").style.display = "none";
  document.getElementById("global_status_text").style.display = "none";
}

function openTab(tabId, el) {
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  if(el) el.classList.add('active');
}

function toggleCustomRequest() {
  document.getElementById("custom_request_group").style.display = (document.getElementById("generation_target").value === 'custom') ? 'block' : 'none';
}

async function readPDF() {
  const file = document.getElementById("pdf_file").files[0];
  const statusEl = document.getElementById("pdf_status");
  if(!file) { alert("حدد ملف PDF أولاً."); return; }
  
  showProgress("⏳ جاري استخلاص النص العادي من الـ PDF...");
  statusEl.innerText = "";
  
  try {
    const arrayBuffer = await file.arrayBuffer();
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
    
    let text = "";
    const textPageLimit = Math.min(pdf.numPages, 30);
    
    for(let i = 1; i <= textPageLimit; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(item => item.str).join(" ") + "\n";
    }

    // الفحص الاستراتيجي للنصوص (إذا كان النص المستخرج أقل من 500 حرف، يعني الكتاب مصور Scan)
    if (text.replace(/\s/g, '').length < 500) {
      showProgress("⚠️ تم اكتشاف كتاب مصور (Scanned PDF). جاري التحويل إلى صور وتشغيل محرك OCR (قد يستغرق دقائق)...");
      text = "";
      const ocrPageLimit = Math.min(pdf.numPages, 5); // تقييد الصفحات لتجنب انهيار المتصفح
      
      for(let i = 1; i <= ocrPageLimit; i++) {
        showProgress(`🔍 جاري المسح البصري (OCR) للصفحة ${i} من ${ocrPageLimit}...`);
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({scale: 1.5});
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        await page.render({canvasContext: ctx, viewport: viewport}).promise;
        
        const imgData = canvas.toDataURL('image/png');
        const result = await Tesseract.recognize(imgData, 'ara');
        text += result.data.text + "\n\n";
      }
      statusEl.innerText = `تم استخراج النصوص بصرياً لـ ${toEasternNumerals(ocrPageLimit)} صفحات فقط لتجنب استهلاك الذاكرة.`;
    } else {
      statusEl.innerText = `تم قراءة الـ PDF النصي بنجاح.`;
    }

    contextDataText = text;
    alert(`✔ تمت العملية بنجاح. (حجم السياق: ${toEasternNumerals(contextDataText.length)} حرف)`);
  } catch(e) { 
    console.error(e); 
    statusEl.innerText = "❌ خطأ في معالجة الملف."; 
  }
  finally { hideProgress(); }
}

async function launchSinglePipeline() {
  const target = document.getElementById("generation_target").value;
  const topic = document.getElementById("generation_topic").value.trim();
  const key = localStorage.getItem("app_secure_key");

  if(!topic) { alert("أدخل موضوع الدرس."); return; }
  if(!key) { alert("لم يتم إدخال مفتاح API."); return; }

  const viewElement = document.getElementById("view_" + target);
  viewElement.innerHTML = "⏳ جاري الاتصال بالخادم السحابي...";
  showProgress("🚀 جاري معالجة الطلب...");
  openTab('sec_' + target, document.querySelector(`.tab-link[onclick*="sec_${target}"]`));

  // تقليل حجم السياق لمنع أخطاء Payload (400, 429)
  const safeContextLimit = 7000; 
  const refContext = contextDataText ? contextDataText.slice(0, safeContextLimit) : "بدون كتاب مرجعي.";

  const prompt = `أنت مساعد تربوي محترف. اكتب المطلوب بترميز الأرقام العربية المشرقية (٠١٢٣٤٥٦٧٨٩) حصراً، بدون أي مقدمات أو شروحات جانبية.
الموضوع: ${topic}
النوع: ${target}
السياق المرجعي: ${refContext}`;

  try {
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      }
    );
    
    const data = await response.json();
    console.log("API Response:", data); // التتبع في الـ Console

    // التقاط الأخطاء الصريحة من الـ API
    if (data.error) {
      throw new Error(`كود الخطأ: ${data.error.code} | الرسالة: ${data.error.message}`);
    }

    let resultText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    
    // التقاط مشكلة الإرجاع الفارغ (غالباً بسبب الحجب الأمني أو مشكلة في الطلب)
    if (!resultText) {
      throw new Error("استجابة الخادم كانت فارغة أو تم حجب المحتوى بواسطة مرشحات الأمان (Safety Ratings).");
    }

    viewElement.innerHTML = convertTextToEasternNumerals(resultText).replace(/\n/g, "<br>");
    
  } catch(e) {
    console.error(e);
    // عرض الخطأ البرمجي بوضوح داخل واجهة المستخدم
    viewElement.innerHTML = `<div class="error-msg">❌ فشل توليد المحتوى:<br>${e.message}<br><br><small>تلميح: إذا كان الخطأ 400، فحجم السياق (النص المستخرج من الـ PDF) ضخم جداً. إذا كان 429، فقد استهلكت الحصة المجانية للمفتاح.</small></div>`;
  } finally {
    hideProgress();
  }
}
</script>
</body>
</html>
