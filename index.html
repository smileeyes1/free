<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher OS v13</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

<div class="min-h-screen flex flex-col">

<header class="bg-slate-900 text-white p-4">
<div class="container mx-auto flex justify-between items-center">
<h1>🏛️ Teacher OS v13</h1>
<input id="teacher" placeholder="المعلم"
class="bg-slate-800 px-3 py-1 rounded text-sm text-white">
</div>
</header>

<div class="flex flex-1 container mx-auto gap-4 p-4">

<aside class="w-72 bg-white border rounded-xl p-3 space-y-3">

<input id="school" placeholder="المدرسة"
class="w-full border p-2 rounded text-sm">

<button onclick="addStudent()"
class="w-full bg-blue-600 text-white py-2 rounded text-sm font-bold">
➕ إضافة طالب
</button>

<div id="studentsList" class="text-sm"></div>

<hr>

<input type="file" id="fileInput" class="text-xs w-full">
<div id="fileStatus" class="text-xs text-gray-500"></div>

</aside>

<main class="flex-1 space-y-4">

<textarea id="customPrompt" rows="5"
class="w-full border p-2 rounded text-sm"></textarea>

<button onclick="runSystem()"
class="mt-3 bg-green-600 text-white px-4 py-2 rounded font-bold">
تنفيذ
</button>

<div id="output"
class="bg-white border rounded-xl p-4 min-h-[320px] text-sm whitespace-pre-wrap"></div>

<div id="status" class="text-xs text-center text-blue-600"></div>

</main>
</div>
</div>

<script>

/* ================= STATE ================= */
let STUDENTS = [];
let FILE_CONTENT = "";

/* ================= CLEAN ================= */
const clean = t => (t || "").replace(/\s+/g,' ').trim();

/* ================= STUDENTS ================= */
function addStudent(){
const n = prompt("اسم الطالب:");
if(!n) return;
STUDENTS.push(clean(n));
renderStudents();
}

function renderStudents(){
document.getElementById("studentsList").innerHTML =
STUDENTS.map((s,i)=>`<div>${i+1}. ${s}</div>`).join("");
}

/* ================= FILE ================= */
document.getElementById("fileInput").addEventListener("change",(e)=>{
const f = e.target.files[0];
if(!f) return;

const r = new FileReader();
r.onload = ev=>{
FILE_CONTENT = clean(ev.target.result || "");
document.getElementById("fileStatus").innerText = "تم تحميل الملف";
};
r.readAsText(f);
});

/* ================= ANALYZER ================= */
function analyze(text){

const t = clean(text + " " + FILE_CONTENT);

return {
t,
weak: /ضعيف/.test(t),
strong: /متفوق/.test(t),
review: /مراجعة/.test(t),
exam: /اختبار/.test(t),
worksheet: /ورقة/.test(t),
lesson: /درس/.test(t),
smart: /و[؟?]/.test(t)
};
}

/* ================= DECISION CORE ================= */
function decide(a, count){

let type = "حصة درس";
let goal = "تعلم أساسي";
let mode = "عادي";

/* routing ثابت */
if(a.exam) type = "حصة اختبار";
else if(a.worksheet) type = "نشاط تطبيقي";
else if(a.lesson) type = "حصة درس";

/* smart mode */
if(a.smart){

mode = "ذكي";

const weight =
a.t.length * 2 +
count * 15 +
(a.weak ? 60 : 0) +
(a.strong ? 70 : 0) +
(a.review ? 40 : 0);

/* حالات واضحة أولاً */
if(a.weak){
type = "حصة علاجية";
goal = "رفع الفهم خطوة خطوة";
}
else if(a.strong){
type = "حصة إثرائية";
goal = "توسيع التفكير";
}
else if(a.review){
type = "حصة مراجعة";
goal = "تثبيت المعرفة";
}
else{
const pool = [
"حصة درس تطبيقي",
"حصة نشاط تعاوني",
"حصة اختبار قصير",
"حصة تدريب عملي"
];

type = pool[weight % pool.length];
goal = "تنفيذ مباشر داخل الصف";
}
}

return {type, goal, mode};
}

/* ================= LESSON BUILDER ================= */
function buildLesson(s, count){

const groups = Math.max(2, Math.ceil(count / 5));

return `
🕒 زمن الحصة: 45 دقيقة

🟡 تمهيد (5)
📘 شرح (10)
🧠 نشاط (${groups} مجموعات)
📊 تقويم (7)
🏁 إغلاق (3)

🎯 الهدف:
${s.goal}
`;
}

/* ================= ENGINE ================= */
function W_ENGINE(input){

if(!input.trim()) return "";

const teacher = document.getElementById("teacher").value || "المعلم";
const school = document.getElementById("school").value || "المدرسة";

const a = analyze(input);
const state = decide(a, STUDENTS.length);
const lesson = buildLesson(state, STUDENTS.length);

return `
🏛️ Teacher OS v13

👨‍🏫 ${teacher}
🏫 ${school}

📌 النوع: ${state.type}
📍 الوضع: ${state.mode}

${lesson}

👥 الطلاب (${STUDENTS.length})
${STUDENTS.length ? STUDENTS.join(" - ") : "لا يوجد"}

📥 الطلب:
${a.t}
`;
}

/* ================= RUN ================= */
function runSystem(){
const input = document.getElementById("customPrompt").value;
document.getElementById("output").innerText = W_ENGINE(input);
document.getElementById("status").innerText = "✔ نظام v13 مستقر";
}

</script>

</body>
</html>
