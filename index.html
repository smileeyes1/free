<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>النظام التعليمي الكامل المتقدم</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
  font-family: Arial;
  max-width:1100px;
  margin:auto;
  padding:20px;
  direction: rtl;
  background:#f5f5f5;
}

.box{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}

input,textarea,select,button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

#out{
  white-space:pre-wrap;
  background:#111;
  color:#0f0;
  padding:15px;
  border-radius:10px;
  min-height:400px;
}

button{cursor:pointer}

@media print{
  body{background:white}
  button,input,select,textarea{display:none}
}
</style>
</head>

<body>

<div class="box">
<h2>📘 النظام التعليمي الكامل</h2>

<button onclick="window.open('https://aistudio.google.com/app/apikey','_blank')">🔑 API KEY</button>
<input id="key" placeholder="API KEY">
<button onclick="localStorage.setItem('key',document.getElementById('key').value.trim())">حفظ</button>
</div>

<div class="box">
<h3>🏫 الهوية</h3>
<input id="teacher" placeholder="المعلم">
<input id="school" placeholder="المدرسة">
<input id="directorate" placeholder="المديرية">
</div>

<div class="box">
<h3>👥 الطلاب</h3>
<textarea id="students" rows="4" placeholder="أسماء الطلاب (كل اسم سطر)"></textarea>
</div>

<div class="box">
<h3>📂 الكتاب</h3>
<input type="file" id="file" accept=".pdf">
<button onclick="loadBook()">تحميل الكتاب</button>
<div id="status">---</div>
</div>

<div class="box">
<h3>⚙️ الإنتاج</h3>

<select id="mode">
<option value="full">إنتاج كامل</option>
<option value="unit">وحدة</option>
<option value="lesson">درس</option>
</select>

<input id="topic" placeholder="وحدة / درس">
<button onclick="run()">🚀 تشغيل</button>
</div>

<div class="box">
<button onclick="printSection('out')">🖨 طباعة</button>
<div id="out">---</div>
</div>

<script>

let book="";

/* ========= تحميل الكتاب ========= */

async function loadBook(){

const file=document.getElementById("file").files[0];
const data=await file.arrayBuffer();
const pdf=await pdfjsLib.getDocument({data}).promise;

let text="";

for(let i=1;i<=pdf.numPages;i++){

const page=await pdf.getPage(i);
const content=await page.getTextContent();

let t=content.items.map(x=>x.str).join(" ");

text+=t+"\n";
}

book=text;

document.getElementById("status").innerText="✔ تم تحميل الكتاب";
}

/* ========= prompt صارم ========= */

function prompt(mode,topic){

const teacher=document.getElementById("teacher").value;
const school=document.getElementById("school").value;
const directorate=document.getElementById("directorate").value;
const students=document.getElementById("students").value;

const ctx=book.slice(0,30000);

const base=`
أنت نظام تربوي صارم جدًا.

ممنوع الدمج بين الأقسام.
ممنوع الاختصار.
كل قسم مستقل بالكامل.

اعتمد فقط على الكتاب.
`;

const header=`
🏫 المدرسة: ${school}
📍 المديرية: ${directorate}
👨‍🏫 المعلم: ${teacher}
👥 الطلاب:
${students}
`;

let task="";

if(mode==="full"){
task=`
أخرج 4 أقسام منفصلة تمامًا:

====================
📘 خطط الدروس
====================
- تقسيم وحدات
- لكل درس: هدف + تمهيد + شرح + نشاط + تقويم

====================
📝 أوراق العمل
====================
- لكل درس ورقة مستقلة
- أسئلة متنوعة

====================
🧪 الاختبارات
====================
- اختبار لكل وحدة
- نموذج إجابة

====================
📊 قوائم الرصد
====================
- معرفي
- مهاري
- سلوكي

⚠️ كل قسم مستقل 100% بدون دمج
`;
}

if(mode==="unit"){
task=`
وحدة: ${topic}

أخرج:
1) خطط
2) أوراق عمل
3) اختبار وحدة
4) قوائم رصد
كل قسم مستقل.
`;
}

if(mode==="lesson"){
task=`
درس: ${topic}

أخرج:
1) خطة درس
2) ورقة عمل
3) اختبار
4) قائمة رصد
كل قسم مستقل.
`;
}

return base+"\n"+header+"\n"+ctx+"\n"+task;
}

/* ========= تشغيل ========= */

async function run(){

const key=localStorage.getItem("key");
if(!key)return;

document.getElementById("out").innerText="جاري التنفيذ...";

const mode=document.getElementById("mode").value;
const topic=document.getElementById("topic").value;

const res=await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`,
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
contents:[{parts:[{text:prompt(mode,topic)}]}]
})
}
);

const data=await res.json();

const result=data?.candidates?.[0]?.content?.parts?.[0]?.text || "خطأ";

document.getElementById("out").innerText=result;
}

/* ========= طباعة ========= */

function printSection(id){
  window.print();
}

</script>

</body>
</html>
