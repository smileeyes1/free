<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO+ V6.1 CORE</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#eef2f7}
.card{background:#fff;margin:12px;padding:15px;border-radius:10px;border:1px solid #ddd}
input,textarea,button,select{width:100%;padding:10px;margin-top:6px;border-radius:6px;border:1px solid #ccc}
button{background:#1d4ed8;color:#fff;border:none;cursor:pointer;font-weight:600}
button:hover{opacity:.9}
.hidden{display:none}
</style>
</head>

<body>

<div class="card">
<h2>PRO+ V6.1</h2>

<input id="apiKey" placeholder="Gemini API Key">
<button onclick="generateKey()">توليد مفتاح</button>
<button onclick="saveKey()">حفظ المفتاح</button>

<input id="teacher" placeholder="المعلم">
<input id="school" placeholder="المدرسة">
<textarea id="students" placeholder="الطلاب"></textarea>

<input type="file" id="pdfUpload">
<input id="topic" placeholder="الموضوع">

<button onclick="executeProductionPipeline()">تشغيل النظام</button>

<div id="pdfProgress" class="hidden">جاري تحليل PDF...</div>
<div id="statusLog"></div>

<div id="completePrintPackage" contenteditable="true"></div>
</div>

<script src="logic.js"></script>
<script src="api.js"></script>

</body>
</html>
