<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>النظام الذكي الكامل للكتب</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
  font-family: Arial;
  max-width: 1000px;
  margin:auto;
  padding:20px;
  direction: rtl;
  background:#f5f5f5;
}

.box{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

input, textarea, select, button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

button{cursor:pointer}

#out{
  white-space:pre-wrap;
  background:#111;
  color:#0f0;
  padding:15px;
  border-radius:10px;
  min-height:250px;
}

.small{font-size:12px;color:#555}
</style>
</head>

<body>

<div class="box">
<h2>📘 نظام تحليل الكتب الذكي (PDF + OCR)</h2>

<button onclick="openKey()">🔑 إنشاء مفتاح</button>
<input id="key" placeholder="أدخل مفتاح Gemini">
<button onclick="saveKey()">💾 حفظ المفتاح</button>
</div>

<div class="box">
<h3>📂 رفع الكتاب</h3>
<input type="file" id="file" accept=".pdf">
<button onclick="loadBook()">📥 تحليل الكتاب</button>
<div id="status" class="small">لا يوجد كتاب</div>
</div>

<div class="box">
<h3>⚙️ نوع التحليل</h3>
<select id="mode">
<option value="full">تحضير كامل للكتاب</option>
<option value="unit">وحدة</option>
<option value="lesson">درس</option>
</select>

<input id="topic" placeholder="اكتب وحدة أو درس (اختياري)">
<button onclick="run()">🚀 توليد المحتوى</button>
</div>

<div class="box">
<button onclick="printPage()">🖨 طباعة</button>
<div id="out">النتائج ستظهر هنا...</div>
</div>

<script>

let book = "";

/* ===================== KEY ===================== */

function openKey(){
  window.open("https://aistudio.google.com/app/apikey","_blank");
}

function saveKey(){
  localStorage.setItem("key", document.getElementById("key").value.trim());
  alert("تم الحفظ");
}

function getKey(){
  return localStorage.getItem("key");
}

/* ===================== PDF + OCR ===================== */

async function loadBook(){

  const file = document.getElementById("file").files[0];
  if(!file){
    alert("اختر ملف PDF");
    return;
  }

  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;

  let text = "";

  for(let i=1;i<=pdf.numPages;i++){

    const page = await pdf.getPage(i);

    // 1) استخراج نص
    const content = await page.getTextContent();
    let pageText = content.items.map(i=>i.str).join(" ");

    // 2) إذا النص ضعيف → OCR
    if(pageText.trim().length < 20){

      const viewport = page.getViewport({scale:2});
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({canvasContext:ctx, viewport}).promise;

      const imgData = canvas.toDataURL("image/png");

      const ocr = await Tesseract.recognize(imgData,'ara+eng');

      pageText = ocr.data.text;
    }

    text += pageText + "\n";
  }

  book = text;

  document.getElementById("status").innerText =
  "✔ تم تحليل الكتاب (" + text.length + " حرف)";
}

/* ===================== AI PROMPT ===================== */

function buildPrompt(mode, topic){

  const base =
`أنت نظام خبير في إعداد المناهج.
اعتمد فقط على الكتاب المرفق.
لا تخترع معلومات خارج النص.`;

  const context = "\n📘 الكتاب:\n" + book.slice(0, 30000);

  let task = "";

  if(mode === "full"){
task =
`حلل الكتاب بالكامل و:
- قسمه إلى وحدات
- لكل وحدة دروس
- لكل درس: هدف + شرح + نشاط + تقويم
- أوراق عمل لكل درس
- اختبار لكل وحدة
- خطة تدريس كاملة`;
  }

  if(mode === "unit"){
task =
`حلل الوحدة: "${topic}"
واخرج:
- الدروس
- خطة كل درس
- أوراق عمل
- اختبار وحدة`;
  }

  if(mode === "lesson"){
task =
`حلل الدرس: "${topic}"
واخرج:
- خطة درس
- نشاط
- ورقة عمل
- تقويم`;
  }

  return base + context + "\n\n" + task;
}

/* ===================== RUN AI ===================== */

async function run(){

  const key = getKey();
  if(!key){ alert("أدخل المفتاح"); return; }

  if(!book){ alert("ارفع الكتاب أولاً"); return; }

  const mode = document.getElementById("mode").value;
  const topic = document.getElementById("topic").value;

  document.getElementById("out").innerText = "⏳ جاري المعالجة...";

  try{

    const res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+key,
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents:[{
            parts:[{ text: buildPrompt(mode,topic) }]
          }]
        })
      }
    );

    const data = await res.json();

    const result = data?.candidates?.[0]?.content?.parts?.[0]?.text;

    document.getElementById("out").innerText =
      result || JSON.stringify(data,null,2);

  }catch(e){
    document.getElementById("out").innerText = e.message;
  }
}

/* ===================== PRINT ===================== */

function printPage(){
  window.print();
}

</script>

</body>
</html>
