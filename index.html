<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>النظام التعليمي الذكي الكامل</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
  font-family: Arial;
  max-width:1100px;
  margin:auto;
  padding:20px;
  direction: rtl;
  background:#f5f5f5;
}

.box{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}

input,textarea,select,button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

button{cursor:pointer}

#out{
  white-space:pre-wrap;
  background:#111;
  color:#0f0;
  padding:15px;
  border-radius:10px;
  min-height:350px;
}

@media print {
  body{background:white}
  button,input,select,textarea{display:none}
}
</style>
</head>

<body>

<div class="box">
<h2>📘 النظام التعليمي الذكي الكامل</h2>

<button onclick="window.open('https://aistudio.google.com/app/apikey','_blank')">🔑 إنشاء مفتاح</button>
<input id="key" placeholder="API KEY">
<button onclick="localStorage.setItem('key',document.getElementById('key').value.trim())">💾 حفظ</button>
</div>

<div class="box">
<h3>🏫 الهوية المدرسية</h3>
<input id="teacher" placeholder="اسم المعلم">
<input id="school" placeholder="اسم المدرسة">
<input id="directorate" placeholder="اسم المديرية">

<input type="file" id="logo" accept="image/*">
<button onclick="loadLogo()">📤 رفع شعار المديرية</button>
<div id="logoStatus">لا يوجد شعار</div>
</div>

<div class="box">
<h3>👥 الطلاب</h3>
<input type="file" id="img" accept="image/*">
<button onclick="extractNames()">📸 استخراج الأسماء من صورة</button>

<textarea id="manualNames" rows="4" placeholder="أسماء يدوية (كل اسم سطر)"></textarea>
<div id="namesStatus">لا يوجد أسماء</div>
</div>

<div class="box">
<h3>📂 الكتاب</h3>
<input type="file" id="file" accept=".pdf">
<button onclick="loadBook()">📥 استخراج الكتاب</button>
<div id="status">---</div>
</div>

<div class="box">
<h3>⚙️ الإنتاج</h3>

<select id="mode">
<option value="full">إنتاج تربوي كامل</option>
<option value="unit">وحدة</option>
<option value="lesson">درس</option>
</select>

<input id="topic" placeholder="وحدة / درس">
<button onclick="run()">🚀 إنتاج</button>
</div>

<div class="box">
<button onclick="window.print()">🖨 طباعة</button>
<div id="out">---</div>
</div>

<script>

let book="";
let logoBase64="";
let students=[];

/* ========= الهوية ========= */

function loadLogo(){
  const f=document.getElementById("logo").files[0];
  const r=new FileReader();
  r.onload=e=>{
    logoBase64=e.target.result;
    document.getElementById("logoStatus").innerText="✔ تم رفع الشعار";
  };
  r.readAsDataURL(f);
}

function getInstitution(){
  return{
    teacher:document.getElementById("teacher").value,
    school:document.getElementById("school").value,
    directorate:document.getElementById("directorate").value,
    logo:logoBase64
  };
}

/* ========= الطلاب ========= */

async function extractNames(){

  const file=document.getElementById("img").files[0];
  const url=URL.createObjectURL(file);

  const res=await Tesseract.recognize(url,'ara+eng');

  students=res.data.text
    .split("\n")
    .map(x=>x.trim())
    .filter(x=>x.length>2);

  document.getElementById("namesStatus").innerText=
  "✔ "+students.length+" اسم";
}

function getStudents(){
  let manual=document.getElementById("manualNames").value
    .split("\n").map(x=>x.trim()).filter(x=>x);

  return [...students,...manual];
}

/* ========= الكتاب ========= */

async function loadBook(){

const file=document.getElementById("file").files[0];
const data=await file.arrayBuffer();
const pdf=await pdfjsLib.getDocument({data}).promise;

let text="";

for(let i=1;i<=pdf.numPages;i++){

  const page=await pdf.getPage(i);

  const content=await page.getTextContent();
  let t=content.items.map(x=>x.str).join(" ");

  if(t.length<20){

    const vp=page.getViewport({scale:2});
    const canvas=document.createElement("canvas");
    const ctx=canvas.getContext("2d");

    canvas.width=vp.width;
    canvas.height=vp.height;

    await page.render({canvasContext:ctx,viewport:vp}).promise;

    const img=canvas.toDataURL();

    const ocr=await Tesseract.recognize(img,'ara+eng');
    t=ocr.data.text;
  }

  text+=t+"\n";
}

book=text;

document.getElementById("status").innerText=
"✔ تم تحميل الكتاب";
}

/* ========= prompt ========= */

function prompt(mode,topic){

const inst=getInstitution();
const names=getStudents().join(" | ");

const header=
`
🏫 ${inst.school}
📍 ${inst.directorate}
👨‍🏫 ${inst.teacher}
👥 الطلاب: ${names}
`;

const base=
`أنت خبير مناهج.
اعتمد فقط على الكتاب.`;

const ctx=book.slice(0,30000);

let task="";

if(mode==="full"){
task=`
إنتاج كامل:

1) خطط دروس
2) أوراق عمل لكل درس
3) اختبارات لكل وحدة
4) قوائم رصد (معرفي/مهاري/سلوكي)

كل شيء قابل للطباعة.`;
}

if(mode==="unit"){
task=`
وحدة: ${topic}
- خطط
- أوراق عمل
- اختبار
- قوائم رصد`;
}

if(mode==="lesson"){
task=`
درس: ${topic}
- خطة درس
- ورقة عمل
- اختبار
- قائمة رصد`;
}

return base+"\n"+header+"\n"+ctx+"\n"+task;
}

/* ========= تشغيل ========= */

async function run(){

const key=localStorage.getItem("key");
if(!key)return;

document.getElementById("out").innerText="...";

const mode=document.getElementById("mode").value;
const topic=document.getElementById("topic").value;

const res=await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`,
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
contents:[{parts:[{text:prompt(mode,topic)}]}]
})
}
);

const data=await res.json();

const result=data?.candidates?.[0]?.content?.parts?.[0]?.text;

const inst=getInstitution();

document.getElementById("out").innerHTML=
(inst.logo?`<img src="${inst.logo}" width="120"><br>`:"")
+result;

}

</script>

</body>
</html>
