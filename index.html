<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>وكيل المعلم</title>
  <style>
    body { font-family: Arial; max-width: 800px; margin: auto; padding: 20px; }
    input, textarea, select, button { width: 100%; padding: 10px; margin-top: 10px; }
    #out { white-space: pre-wrap; background: #111; color: #0f0; padding: 15px; margin-top: 20px; }
  </style>
</head>

<body>

<h2>🧠 وكيل المعلم الذكي</h2>

<button onclick="openKey()">🔑 إنشاء مفتاح</button>

<input id="key" placeholder="ألصق المفتاح مرة واحدة فقط">

<button onclick="saveKey()">💾 حفظ المفتاح</button>

<hr>

<select id="mode">
  <option value="lesson">خطة درس</option>
  <option value="worksheet">ورقة عمل</option>
  <option value="test">اختبار</option>
  <option value="evaluation">تقييم طالب</option>
</select>

<textarea id="input" rows="5" placeholder="اكتب الموضوع..."></textarea>

<button onclick="run()">🚀 تشغيل</button>

<div id="out"></div>

<script>
function openKey() {
  window.open("https://aistudio.google.com/app/apikey", "_blank");
}

function saveKey() {
  const key = document.getElementById("key").value;
  localStorage.setItem("gemini_key", key);
  alert("تم الحفظ ✔");
}

function getKey() {
  return localStorage.getItem("gemini_key");
}

function buildPrompt(mode, text) {
  const base = "أنت وكيل مدرسي عملي. أعطِ نتائج منظمة وقابلة للتطبيق فورًا.";

  const tasks = {
    lesson: "صمم خطة درس كاملة.",
    worksheet: "أنشئ ورقة عمل.",
    test: "أنشئ اختبار مع الإجابات.",
    evaluation: "اكتب تقييم تربوي لطالب."
  };

  return base + "\n" + tasks[mode] + "\nالموضوع: " + text;
}

async function run() {
  const key = getKey();
  if (!key) {
    alert("أدخل المفتاح أولاً");
    return;
  }

  const mode = document.getElementById("mode").value;
  const text = document.getElementById("input").value;

  const prompt = buildPrompt(mode, text);

  const res = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + key,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })
    }
  );

  const data = await res.json();

  document.getElementById("out").innerText =
    data.candidates?.[0]?.content?.parts?.[0]?.text || "خطأ في التنفيذ";
}
</script>

</body>
</html>
