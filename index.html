<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>نظام الكتاب التعليمي الذكي</title>

<style>
body{
  font-family: Arial;
  max-width: 1000px;
  margin:auto;
  padding:20px;
  direction: rtl;
  background:#f5f5f5;
}

.box{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}

textarea,input,select,button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

button{cursor:pointer}

#out{
  white-space:pre-wrap;
  background:#111;
  color:#0f0;
  padding:15px;
  border-radius:10px;
  min-height:200px;
}

.small{
  font-size:13px;
  color:#555;
}
</style>
</head>

<body>

<div class="box">
<h2>📘 النظام التعليمي الذكي من الكتاب</h2>

<button onclick="openKey()">🔑 إنشاء مفتاح</button>
<input id="key" placeholder="أدخل المفتاح">
<button onclick="saveKey()">💾 حفظ المفتاح</button>
</div>

<div class="box">
<h3>📚 رفع الكتاب (TXT فقط الآن)</h3>
<input type="file" id="file">
<button onclick="loadBook()">📥 تحميل الكتاب</button>
<div id="status" class="small">لا يوجد كتاب</div>
</div>

<div class="box">
<h3>⚙️ نوع الإخراج</h3>
<select id="mode">
<option value="full">تحضير كامل للكتاب</option>
<option value="unit">وحدة واحدة</option>
<option value="lesson">درس واحد</option>
</select>

<input id="topic" placeholder="اكتب (وحدة / درس / موضوع)">
<button onclick="run()">🚀 تشغيل التحليل</button>
</div>

<div class="box">
<button onclick="printPage()">🖨 طباعة</button>
<div id="out">النتائج ستظهر هنا...</div>
</div>

<script>

let book = "";

function openKey(){
  window.open("https://aistudio.google.com/app/apikey","_blank");
}

function saveKey(){
  const key = document.getElementById("key").value.trim();
  localStorage.setItem("key",key);
  alert("تم الحفظ");
}

function getKey(){
  return localStorage.getItem("key");
}

function loadBook(){
  const file = document.getElementById("file").files[0];
  if(!file){ alert("اختر ملف"); return; }

  const reader = new FileReader();
  reader.onload = e=>{
    book = e.target.result;
    document.getElementById("status").innerText =
      "✔ تم تحميل الكتاب ("+book.length+" حرف)";
  };
  reader.readAsText(file);
}

// بناء تعليمات قوية
function buildPrompt(mode, topic){

  const base =
`أنت نظام خبير في إعداد المناهج الدراسية.
اعتمد فقط على الكتاب المرفق.
لا تخترع معلومات خارج النص.`;

  const context = "\n📘 الكتاب:\n" + book.slice(0, 25000);

  let task = "";

  if(mode === "full"){
    task =
`حلل الكتاب بالكامل وقدم:
1- تقسيمه إلى وحدات
2- كل وحدة فيها دروس
3- لكل درس:
   - هدف
   - تمهيد
   - شرح
   - نشاط
   - تقويم
4- لكل وحدة اختبار شامل
5- أوراق عمل لكل درس`;
  }

  if(mode === "unit"){
    task =
`حلل الوحدة التالية فقط:
"${topic}"
واخرج:
- دروسها
- خطة كل درس
- أوراق عمل
- اختبار وحدة`;
  }

  if(mode === "lesson"){
    task =
`حلل الدرس التالي فقط:
"${topic}"
واخرج:
- خطة درس كاملة
- نشاط
- ورقة عمل
- تقويم`;
  }

  return base + context + "\n\n" + task;
}

// تشغيل النموذج
async function run(){

  const key = getKey();
  if(!key){ alert("أدخل المفتاح"); return; }

  if(!book){ alert("ارفع الكتاب أولاً"); return; }

  const mode = document.getElementById("mode").value;
  const topic = document.getElementById("topic").value;

  document.getElementById("out").innerText = "⏳ جاري المعالجة...";

  try{

    const res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+key,
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          contents:[{
            parts:[{ text: buildPrompt(mode,topic) }]
          }]
        })
      }
    );

    const data = await res.json();

    if(!res.ok){
      document.getElementById("out").innerText =
      JSON.stringify(data,null,2);
      return;
    }

    const result = data?.candidates?.[0]?.content?.parts?.[0]?.text;

    document.getElementById("out").innerText =
      result || "لا يوجد رد";

  }catch(e){
    document.getElementById("out").innerText = e.message;
  }
}

function printPage(){
  window.print();
}

</script>

</body>
</html>
