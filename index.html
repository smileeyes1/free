<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>وكيل المعلم الذكي</title>

<style>
body{
  font-family: Arial;
  max-width: 900px;
  margin: auto;
  padding: 20px;
  direction: rtl;
  background:#f5f5f5;
}

.box{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

input, textarea, select, button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

button{cursor:pointer;}

#out{
  white-space:pre-wrap;
  background:#111;
  color:#0f0;
  padding:15px;
  border-radius:10px;
  min-height:120px;
}
</style>
</head>

<body>

<div class="box">
<h2>🧠 وكيل المعلم الذكي</h2>

<button onclick="openKey()">🔑 إنشاء مفتاح</button>

<input id="key" placeholder="أدخل مفتاح Gemini هنا">

<button onclick="saveKey()">💾 حفظ المفتاح</button>
</div>

<div class="box">
<select id="mode">
  <option value="lesson">خطة درس</option>
  <option value="worksheet">ورقة عمل</option>
  <option value="test">اختبار</option>
  <option value="evaluation">تقييم طالب</option>
</select>

<textarea id="input" rows="5" placeholder="اكتب الموضوع..."></textarea>

<button onclick="run()">🚀 تشغيل</button>
</div>

<div class="box">
<div id="out">النتيجة ستظهر هنا...</div>
</div>

<script>

// فتح صفحة المفتاح
function openKey(){
  window.open("https://aistudio.google.com/app/apikey","_blank");
}

// حفظ المفتاح محليًا
function saveKey(){
  const key = document.getElementById("key").value.trim();
  if(!key){
    alert("أدخل المفتاح");
    return;
  }
  localStorage.setItem("gemini_key", key);
  alert("تم الحفظ ✔");
}

// جلب المفتاح
function getKey(){
  return localStorage.getItem("gemini_key");
}

// بناء التعليمات
function buildPrompt(mode, text){

  const base = "أنت وكيل معلم ذكي. أعطِ نتائج منظمة، دقيقة، قابلة للتطبيق مباشرة.";

  const tasks = {
    lesson: "صمم خطة درس كاملة (هدف، تمهيد، نشاط، تقويم).",
    worksheet: "أنشئ ورقة عمل تعليمية متدرجة.",
    test: "أنشئ اختبارًا مع إجابات نموذجية.",
    evaluation: "اكتب تقييمًا تربويًا وسلوكيًا لطالب."
  };

  return base + "\n" + tasks[mode] + "\nالموضوع: " + text;
}

// التشغيل الرئيسي
async function run(){

  const key = getKey();

  if(!key){
    document.getElementById("out").innerText =
    "⚠ أدخل المفتاح أولاً";
    return;
  }

  const mode = document.getElementById("mode").value;
  const text = document.getElementById("input").value.trim();

  if(!text){
    document.getElementById("out").innerText =
    "⚠ اكتب الموضوع أولاً";
    return;
  }

  const prompt = buildPrompt(mode, text);

  document.getElementById("out").innerText = "⏳ جاري التنفيذ...";

  try{

    const res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + key,
      {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          contents:[
            {
              parts:[{ text: prompt }]
            }
          ]
        })
      }
    );

    const data = await res.json();

    if(!res.ok){
      document.getElementById("out").innerText =
      "❌ خطأ API:\n" + JSON.stringify(data, null, 2);
      return;
    }

    const result = data?.candidates?.[0]?.content?.parts?.[0]?.text;

    if(!result){
      document.getElementById("out").innerText =
      "❌ لا يوجد رد صالح:\n" + JSON.stringify(data, null, 2);
      return;
    }

    document.getElementById("out").innerText = result;

  }catch(err){
    document.getElementById("out").innerText =
    "❌ خطأ اتصال:\n" + err.message;
  }
}

</script>

</body>
</html>
