<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO+ V5 EDGE OPTIMIZED</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#eef2f7}
.container{max-width:1200px;margin:auto;padding:15px}
header{background:#0b2f5c;color:#fff;padding:18px;border-radius:10px;text-align:center}
.card{background:#fff;padding:15px;margin-top:12px;border-radius:10px;border:1px solid #ddd}
input,textarea,select,button{width:100%;padding:10px;margin-top:6px;border-radius:6px;border:1px solid #ccc}
button{background:#1d4ed8;color:#fff;border:none;cursor:pointer;font-weight:600}
button:hover{opacity:.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;margin-top:12px;gap:5px}
.tab{flex:1;text-align:center;padding:10px;background:#dbe2ef;cursor:pointer;border-radius:8px;font-weight:700}
.tab.active{background:#0b2f5c;color:#fff}
.section{display:none}
.section.active{display:block}
.loader{display:none;height:8px;background:#ddd;border-radius:10px;overflow:hidden;margin-top:10px}
.loader div{width:100%;height:100%;background:linear-gradient(90deg,#1d4ed8,#60a5fa);animation:move 1s linear infinite}
@keyframes move{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
small{color:#555}
</style>
</head>

<body>

<div class="container">

<header>
<h2>PRO+ V5 EDGE OPTIMIZED</h2>
<small>AI Efficient • Cache • Local Intelligence • Minimal API</small>
</header>

<div class="card">

<h3>الإعدادات الذكية</h3>

<input id="apiKey" placeholder="Gemini API Key">

<select id="mode">
<option value="eco">وضع اقتصادي (API أقل)</option>
<option value="smart" selected>وضع ذكي (متوازن)</option>
<option value="full">وضع قوي (API أعلى)</option>
</select>

<div class="grid">
<input id="teacher" placeholder="المعلم">
<input id="school" placeholder="المدرسة">
</div>

<textarea id="students" placeholder="الطلاب"></textarea>

<button onclick="saveKey()">حفظ المفتاح</button>
<button onclick="generateKey()">توليد مفتاح</button>

</div>

<div class="card">
<h3>الملفات</h3>
<input type="file" id="file">
<button onclick="runOCR()">OCR</button>
<button onclick="loadPDF()">PDF</button>
</div>

<div class="card">
<h3>التشغيل</h3>
<input id="topic" placeholder="الموضوع">
<button onclick="start()">تشغيل النظام الذكي</button>
<div class="loader" id="loader"><div></div></div>
</div>

<div class="tabs">
<div class="tab active" onclick="tab(0)">النتيجة</div>
</div>

<div class="card section active" id="out"></div>

</div>

<script>

/* ================= STATE ================= */
const S = {
pdf:"",
key:"",
cache:{}
};

const loader = document.getElementById("loader");

/* ================= UTILS ================= */
const log = (t)=>out.innerText = t;

/* ================= CACHE ================= */
function getCache(key){
return S.cache[key];
}

function setCache(key,val){
S.cache[key]=val;
}

/* ================= KEY ================= */
function saveKey(){
S.key = apiKey.value.trim();
localStorage.setItem("k",S.key);
alert("تم الحفظ");
}

function generateKey(){
apiKey.value = "GEM-" + crypto.randomUUID().slice(0,8);
}

/* ================= PDF MINIMIZER ================= */
async function loadPDF(){
const f=file.files[0];
if(!f)return;

loader.style.display="block";

const buf = await f.arrayBuffer();
const pdf = await pdfjsLib.getDocument({data:buf}).promise;

let text="";
for(let i=1;i<=Math.min(25,pdf.numPages);i++){
const p=await pdf.getPage(i);
const c=await p.getTextContent();
text+=c.items.map(x=>x.str).join(" ");
}

S.pdf = text.slice(0,6000);

loader.style.display="none";
}

/* ================= OCR ================= */
async function runOCR(){
const f=file.files[0];
if(!f)return;

loader.style.display="block";

const r = await Tesseract.recognize(f,"ara");
students.value = r.data.text;

loader.style.display="none";
}

/* ================= LOCAL INTELLIGENCE ================= */
function localAnalyze(){
return `
تحليل محلي:
- عدد الطلاب: ${(students.value||"").split("\n").length}
- موضوع: ${topic.value}
- سياق: ${S.pdf.length > 1000 ? "موجود" : "ضعيف"}
`;
}

/* ================= DECISION ENGINE ================= */
function shouldUseAPI(){
const mode = document.getElementById("mode").value;

if(mode === "eco") return false;
if(mode === "full") return true;

return S.pdf.length > 2000 || students.value.length > 50;
}

/* ================= SINGLE AI CALL ================= */
async function AI(prompt){

if(!shouldUseAPI()){
return "LOCAL MODE:\n\n" + localAnalyze();
}

if(!S.key) return "NO API KEY";

const cacheKey = btoa(prompt).slice(0,40);
if(getCache(cacheKey)) return getCache(cacheKey);

const r = await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${S.key}`,
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
contents:[{parts:[{text:prompt}]}]
})
});

const d = await r.json();
const res = d?.candidates?.[0]?.content?.parts?.[0]?.text || "error";

setCache(cacheKey,res);
return res;
}

/* ================= SINGLE BATCH PIPELINE ================= */
async function start(){

loader.style.display="block";

/* 🔥 دمج كل الطلبات في طلب واحد فقط */
const prompt = `
أنت نظام تعليمي ذكي.

المعلم: ${teacher.value}
المدرسة: ${school.value}
الطلاب: ${students.value}

الموضوع: ${topic.value}

المحتوى:
${S.pdf}

المطلوب:
1- خطة درس
2- أوراق عمل
3- اختبار
4- رصد طلاب

أخرجها في أقسام واضحة.
`;

const result = await AI(prompt);

out.innerText = result;

loader.style.display="none";
}

/* ================= TAB ================= */
function tab(){}

</script>

</body>
</html>
