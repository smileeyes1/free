<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النظام التعليمي الذكي الشامل - النسخة الموسعة</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
/* ===================== GLOBAL ===================== */
body{
margin:0;
font-family:Segoe UI;
background:#eef2f7;
color:#111;
}

.container{
max-width:1200px;
margin:auto;
padding:15px;
}

/* ===================== HEADER ===================== */
header{
background:#0b2a5a;
color:#fff;
padding:20px;
border-radius:10px;
text-align:center;
}

/* ===================== CARD ===================== */
.card{
background:#fff;
margin-top:15px;
padding:15px;
border-radius:10px;
border:1px solid #ddd;
}

/* ===================== INPUT ===================== */
input,textarea,select,button{
width:100%;
padding:10px;
margin-top:6px;
border-radius:6px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
background:#2563eb;
color:#fff;
border:none;
cursor:pointer;
transition:0.2s;
}

button:hover{
opacity:0.9;
}

/* ===================== GRID ===================== */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

/* ===================== TABS ===================== */
.tabs{
display:flex;
gap:5px;
margin-top:15px;
}

.tab{
flex:1;
padding:10px;
text-align:center;
background:#d7dbe3;
cursor:pointer;
border-radius:8px;
font-weight:bold;
}

.tab.active{
background:#0b2a5a;
color:#fff;
}

/* ===================== SECTION ===================== */
.section{
display:none;
margin-top:10px;
}

.section.active{
display:block;
}

/* ===================== LOADER ===================== */
.loader{
display:none;
margin-top:10px;
height:10px;
background:#ddd;
border-radius:10px;
overflow:hidden;
}

.loader div{
height:100%;
width:100%;
background:linear-gradient(90deg,#2563eb,#60a5fa,#2563eb);
animation:move 1.2s linear infinite;
}

@keyframes move{
0%{transform:translateX(-100%)}
100%{transform:translateX(100%)}
}

/* ===================== TABLE ===================== */
table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border:1px solid #ddd;
padding:6px;
text-align:center;
font-size:13px;
}

/* ===================== SMALL ===================== */
.small{
font-size:12px;
color:#666;
}
</style>
</head>

<body>

<div class="container">

<!-- ================= HEADER ================= -->
<header>
<h2>النظام التعليمي الذكي الشامل - النسخة الموسعة</h2>
<p class="small">نظام متكامل لإنتاج الخطط + الأوراق + الاختبارات + الرصد + OCR + PDF + Gemini</p>
</header>

<!-- ================= SETTINGS ================= -->
<div class="card">
<h3>الإعدادات الأساسية</h3>

<input id="apiKey" placeholder="Gemini API Key (اختياري)">
<button onclick="saveKey()">حفظ المفتاح</button>

<div class="grid">
<input id="teacher" placeholder="المعلم">
<input id="school" placeholder="المدرسة">
</div>

<textarea id="students" placeholder="أسماء الطلاب"></textarea>
</div>

<!-- ================= FILES ================= -->
<div class="card">
<h3>المصادر</h3>

<input type="file" id="file">

<button onclick="extractOCR()">استخراج أسماء (OCR)</button>
<button onclick="loadPDF()">تحميل PDF</button>
</div>

<!-- ================= GENERATION ================= -->
<div class="card">
<h3>التوليد الذكي</h3>

<select id="mode">
<option value="lesson">درس</option>
<option value="unit">وحدة</option>
<option value="full">منهج كامل</option>
</select>

<input id="topic" placeholder="عنوان الموضوع">

<button onclick="runPipeline()">تشغيل النظام الكامل</button>
</div>

<!-- ================= LOADER ================= -->
<div class="card">
<div class="loader" id="loader"><div></div></div>
</div>

<!-- ================= TABS ================= -->
<div class="tabs">
<div class="tab active" onclick="openTab(0)">خطط</div>
<div class="tab" onclick="openTab(1)">أوراق</div>
<div class="tab" onclick="openTab(2)">اختبارات</div>
<div class="tab" onclick="openTab(3)">رصد</div>
</div>

<div class="card section active" id="s0"></div>
<div class="card section" id="s1"></div>
<div class="card section" id="s2"></div>
<div class="card section" id="s3"></div>

</div>

<script>

/* ================= STATE ================= */
const State = {
pdf:"",
key:"",
busy:false,
queue:[]
};

/* ================= INIT ================= */
window.onload=()=>{
State.key=localStorage.getItem("key")||"";
apiKey.value=State.key;
};

/* ================= SAVE KEY ================= */
function saveKey(){
State.key=apiKey.value.trim();
localStorage.setItem("key",State.key);
alert("تم حفظ المفتاح");
}

/* ================= LOADER ================= */
function setLoading(v){
loader.style.display=v?"block":"none";
}

/* ================= OCR ================= */
async function extractOCR(){
const f=file.files[0];
if(!f)return;

setLoading(true);

const r=await Tesseract.recognize(f,"ara");
students.value=r.data.text;

setLoading(false);
}

/* ================= PDF ================= */
async function loadPDF(){
const f=file.files[0];
if(!f)return;

setLoading(true);

const buf=await f.arrayBuffer();
const pdf=await pdfjsLib.getDocument({data:buf}).promise;

let text="";

for(let i=1;i<=Math.min(pdf.numPages,60);i++){
const p=await pdf.getPage(i);
const c=await p.getTextContent();
text+=c.items.map(x=>x.str).join(" ")+"\n";
}

State.pdf=text;

setLoading(false);
}

/* ================= AI ENGINE ================= */
async function AI(prompt){

if(!State.key){
return "⚠️ وضع محلي\n\n"+prompt.slice(0,800);
}

try{
const res=await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${State.key}`,
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
contents:[{parts:[{text:prompt}]}]
})
});

const data=await res.json();
return data?.candidates?.[0]?.content?.parts?.[0]?.text || "خطأ";
}
catch(e){
return "فشل الاتصال";
}
}

/* ================= PROMPT ================= */
function buildPrompt(type){

return `
نظام تعليم احترافي.

المعلم: ${teacher.value}
الطلاب: ${students.value}

المحتوى:
${State.pdf.slice(0,12000)}

المطلوب:
${type}

أنتج محتوى كامل بدون اختصار.
`;
}

/* ================= PIPELINE ================= */
async function runPipeline(){

if(State.busy)return;
State.busy=true;

setLoading(true);

const tasks=[
["خطط الدروس",s0],
["أوراق العمل",s1],
["الاختبارات",s2],
["الرصد",s3]
];

for(let i=0;i<tasks.length;i++){

tasks[i][1].innerText="جاري التوليد...";

const result=await AI(buildPrompt(tasks[i][0]));

tasks[i][1].innerText=result;

await new Promise(r=>setTimeout(r,300)); // منع التجميد
}

setLoading(false);
State.busy=false;
}

/* ================= TABS ================= */
function openTab(i){

document.querySelectorAll(".section").forEach(e=>e.classList.remove("active"));
document.querySelectorAll(".tab").forEach(e=>e.classList.remove("active"));

document.getElementById("s"+i).classList.add("active");
document.querySelectorAll(".tab")[i].classList.add("active");
}

</script>

</body>
</html>
