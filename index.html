<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>منصة المعلم الذكي المتقدمة</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
  font-family: Arial;
  max-width:1100px;
  margin:auto;
  padding:20px;
  direction: rtl;
  background:#f5f5f5;
}

.box{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}

input,textarea,select,button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

button{cursor:pointer}

#out{
  white-space:pre-wrap;
  background:#111;
  color:#0f0;
  padding:15px;
  border-radius:10px;
  min-height:300px;
}

.small{font-size:12px;color:#555}
</style>
</head>

<body>

<div class="box">
<h2>📘 منصة المعلم الذكي المتقدمة</h2>

<button onclick="window.open('https://aistudio.google.com/app/apikey','_blank')">🔑 إنشاء مفتاح</button>
<input id="key" placeholder="API KEY">
<button onclick="saveKey()">💾 حفظ المفتاح</button>
</div>

<div class="box">
<h3>📚 مكتبة الكتب</h3>

<input type="file" id="file" accept=".pdf">
<button onclick="addBook()">➕ إضافة كتاب للمكتبة</button>

<select id="books"></select>
<button onclick="loadSelectedBook()">📥 تحميل الكتاب المحدد</button>

<div id="status">لا يوجد كتب</div>
</div>

<div class="box">
<h3>⚙️ إعداد التحضير</h3>

<select id="mode">
<option value="full">تحضير كامل للكتاب</option>
<option value="unit">وحدة</option>
<option value="lesson">درس</option>
</select>

<input id="topic" placeholder="وحدة / درس">

<button onclick="run()">🚀 توليد المحتوى</button>
</div>

<div class="box">
<button onclick="window.print()">🖨 طباعة</button>
<div id="out">---</div>
</div>

<script>

let books=[];
let currentBook="";

function saveKey(){
  localStorage.setItem("key",document.getElementById("key").value.trim());
}

function getKey(){
  return localStorage.getItem("key");
}

/* ===== مكتبة الكتب ===== */

function addBook(){

  const file=document.getElementById("file").files[0];
  if(!file)return;

  books.push({file,name:file.name});

  refreshBooks();

  document.getElementById('status').innerText=
  "✔ عدد الكتب: "+books.length;
}

function refreshBooks(){

  const sel=document.getElementById("books");
  sel.innerHTML="";

  books.forEach((b,i)=>{
    const opt=document.createElement("option");
    opt.value=i;
    opt.text=b.name;
    sel.appendChild(opt);
  });
}

async function loadSelectedBook(){

  const i=document.getElementById("books").value;
  const file=books[i].file;

  const data=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data}).promise;

  let text="";

  for(let p=1;p<=pdf.numPages;p++){

    const page=await pdf.getPage(p);

    const content=await page.getTextContent();
    let t=content.items.map(x=>x.str).join(" ");

    if(t.length<20){

      const vp=page.getViewport({scale:2});
      const canvas=document.createElement("canvas");
      const ctx=canvas.getContext("2d");

      canvas.width=vp.width;
      canvas.height=vp.height;

      await page.render({canvasContext:ctx,viewport:vp}).promise;

      const img=canvas.toDataURL();

      const ocr=await Tesseract.recognize(img,'ara+eng');
      t=ocr.data.text;
    }

    text+=t+"\n";
  }

  currentBook=text;

  document.getElementById('status').innerText=
  "✔ تم تحميل الكتاب ("+text.length+")";
}

/* ===== الذكاء ===== */

function prompt(mode,topic){

const base=`أنت نظام إعداد مناهج متقدم.
اعتمد فقط على الكتاب ولا تضف معلومات خارجية.`;

const ctx=currentBook.slice(0,35000);

let task="";

if(mode==="full"){
task=`
تحضير شامل:
- تقسيم إلى وحدات
- تقسيم كل وحدة إلى دروس
- لكل درس: هدف + شرح + نشاط + تقويم
- أوراق عمل لكل درس
- اختبار لكل وحدة
- خطة تدريس كاملة منظمة`;
}

if(mode==="unit"){
task=`
تحليل وحدة: ${topic}
- الدروس
- خطة كل درس
- أوراق عمل
- اختبار وحدة`;
}

if(mode==="lesson"){
task=`
تحليل درس: ${topic}
- خطة درس
- نشاط
- ورقة عمل
- تقويم`;
}

return base+"\n"+ctx+"\n"+task;
}

/* ===== تشغيل ===== */

async function run(){

const key=getKey();
if(!key)return;

if(!currentBook)return;

document.getElementById('out').innerText="...";

const mode=document.getElementById('mode').value;
const topic=document.getElementById('topic').value;

const res=await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`,
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
contents:[{parts:[{text:prompt(mode,topic)}]}]
})
}
);

const data=await res.json();

document.getElementById('out').innerText=
data?.candidates?.[0]?.content?.parts?.[0]?.text
|| JSON.stringify(data,null,2);

}

</script>

</body>
</html>
